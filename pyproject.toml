[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garimpo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "tqdm",
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
]

[tool.setuptools.packages.find]
where = ["src"]
